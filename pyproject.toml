[project]
name = "hexoreview"
version = "1.0.0"
description = "Blinded clinician review of overnight Hexoskin recordings for seizure marking"
requires-python = ">=3.10"
dependencies = [
    "mne>=1.6",
    "numpy>=1.24",
    "pandas>=2.0",
    "panel>=1.4",
    "bokeh>=3.4",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "edfio>=0.4.14",
]

[project.scripts]
hexoreview = "hexoreview.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hexoreview"]

[tool.uv]
package = true
